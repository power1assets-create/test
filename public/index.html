<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Todo List</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // เปิด dark mode แบบ class-based
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <style>
    /* Custom scrollbar สำหรับ dark mode */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }

    /* Transition สำหรับ todo item */
    .todo-item { transition: opacity 0.2s, transform 0.15s; }
    .todo-item:hover { transform: translateX(2px); }

    /* Glow effect สำหรับ input focus */
    #todo-input:focus { box-shadow: 0 0 0 2px #6366f1, 0 0 12px rgba(99,102,241,0.4); }

    /* ขีดฆ่าเมื่อ task เสร็จ */
    .line-through-text { text-decoration: line-through; }
  </style>
</head>

<!-- พื้นหลังสีดำ dark mode -->
<body class="dark bg-gray-950 min-h-screen flex items-start justify-center py-14 px-4">

  <!-- Card หลัก -->
  <div class="w-full max-w-lg bg-gray-900 rounded-2xl shadow-2xl shadow-black/60 border border-gray-800 p-8">

    <!-- Header -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-white tracking-tight">
        ✅ My Todo List
      </h1>
      <!-- นับจำนวน task ที่ยังไม่เสร็จ -->
      <p id="summary" class="mt-2 text-sm text-gray-500"></p>
    </div>

    <!-- Input Form -->
    <div class="flex gap-2 mb-6">
      <input
        id="todo-input"
        type="text"
        placeholder="เพิ่ม task ใหม่..."
        autocomplete="off"
        class="flex-1 bg-gray-800 text-white placeholder-gray-600
               border border-gray-700 rounded-xl px-4 py-2.5 text-sm
               outline-none transition-all duration-200"
      />
      <button
        id="add-btn"
        class="bg-indigo-600 hover:bg-indigo-500 active:scale-95
               text-white font-semibold px-5 py-2.5 rounded-xl text-sm
               transition-all duration-150 cursor-pointer whitespace-nowrap"
      >
        + เพิ่ม
      </button>
    </div>

    <!-- Filter Buttons -->
    <div class="flex gap-2 mb-5">
      <button
        class="filter-btn flex-1 py-1.5 rounded-lg text-xs font-medium border
               border-indigo-500 bg-indigo-600 text-white transition-all duration-150 cursor-pointer"
        data-filter="all"
      >ทั้งหมด</button>
      <button
        class="filter-btn flex-1 py-1.5 rounded-lg text-xs font-medium border
               border-gray-700 bg-gray-800 text-gray-400 hover:text-white
               hover:border-gray-500 transition-all duration-150 cursor-pointer"
        data-filter="active"
      >ยังไม่เสร็จ</button>
      <button
        class="filter-btn flex-1 py-1.5 rounded-lg text-xs font-medium border
               border-gray-700 bg-gray-800 text-gray-400 hover:text-white
               hover:border-gray-500 transition-all duration-150 cursor-pointer"
        data-filter="completed"
      >เสร็จแล้ว</button>
    </div>

    <!-- Divider -->
    <div class="border-t border-gray-800 mb-4"></div>

    <!-- Todo List -->
    <ul id="todo-list" class="space-y-2 min-h-[60px]"></ul>

  </div>

  <!-- โหลด JavaScript หลัก -->
  <script src="app.js"></script>

</body>
</html>
