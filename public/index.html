<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List App</title>
  <style>
    /* ---- Reset & Base ---- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    /* ---- Container ---- */
    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 32px;
      width: 100%;
      max-width: 520px;
      height: fit-content;
    }

    h1 {
      text-align: center;
      color: #2d3748;
      margin-bottom: 24px;
      font-size: 1.8rem;
    }

    /* ---- Input Form ---- */
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    #todo-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #todo-input:focus {
      border-color: #667eea;
    }

    #add-btn {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    #add-btn:hover {
      background: #5a67d8;
    }

    /* ---- Filter Buttons ---- */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      flex: 1;
      padding: 6px;
      border: 2px solid #cbd5e0;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    /* ---- Todo List ---- */
    #todo-list {
      list-style: none;
    }

    /* แต่ละรายการ Todo */
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      transition: opacity 0.2s;
    }

    /* Todo ที่เสร็จแล้ว จะจางลง */
    .todo-item.completed {
      opacity: 0.6;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    /* Checkbox */
    .todo-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #2d3748;
      word-break: break-word;
    }

    /* ปุ่มลบ */
    .delete-btn {
      background: none;
      border: none;
      color: #fc8181;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .delete-btn:hover {
      background: #fff5f5;
    }

    /* ---- Footer summary ---- */
    .summary {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #718096;
      text-align: center;
    }

    /* ---- Empty state ---- */
    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 32px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Todo List</h1>

    <!-- ฟอร์มเพิ่ม Todo -->
    <div class="input-row">
      <input
        id="todo-input"
        type="text"
        placeholder="เพิ่มรายการใหม่..."
        autocomplete="off"
      />
      <button id="add-btn">เพิ่ม</button>
    </div>

    <!-- ปุ่มกรอง -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
      <button class="filter-btn" data-filter="active">ยังไม่เสร็จ</button>
      <button class="filter-btn" data-filter="completed">เสร็จแล้ว</button>
    </div>

    <!-- รายการ Todo -->
    <ul id="todo-list"></ul>

    <!-- สรุปจำนวน -->
    <p class="summary" id="summary"></p>
  </div>

  <!-- โหลด JavaScript หลัก -->
  <script src="app.js"></script>
</body>
</html>
